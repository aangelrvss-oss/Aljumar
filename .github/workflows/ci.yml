# Pruebas en cada cambio. No publica nada.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      STAGING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run check
      - run: npm run test:php
      # Las pruebas e2e se ejecutan sobre una compilación indexable (sin STAGING)
      - run: STAGING=0 npm run build && npm run test:e2e
