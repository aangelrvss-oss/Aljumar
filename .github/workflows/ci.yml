# Pruebas en cada cambio. No publica nada.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:unit
      # Compilación de pruebas: todo bloqueado a buscadores
      - run: STAGING=1 npm run build && npm run check
      # Compilación indexable (como producción, con el inventario de muestra)
      - run: npm run build
      - run: npm run check
      - run: npm run test:php
      - run: npm run test:e2e
